<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Presentation library</title>
  <meta name="description" content="Innoraft delivery decks and integration briefings.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root {
  --navy: #003352;
  --navy2: #002949;
  --navy3: #0B4A72;
  --orange: #F67A0E;
  --deep: #F1621B;
  --amber: #FEC363;
  --body: #33404D;
  --mute: #5B6B78;
  --ice: #E6EEF4;
  --display: "Bebas Neue", Impact, sans-serif;
  --sans: "Poppins", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2, 0, 0, 1);
}
* { box-sizing: border-box }
html, body { margin: 0; min-height: 100% }
body {
  font-family: var(--sans);
  color: #fff;
  background: var(--navy);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit }
.vh {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.page {
  position: relative;
  min-height: 100vh;
  padding: 48px 64px 56px;
  overflow-x: hidden;
}
.bg {
  position: absolute;
  inset: auto -80px -120px auto;
  width: min(720px, 52vw);
  pointer-events: none;
  opacity: .9;
}
.bg svg { display: block; width: 100%; height: auto }
.road-b {
  fill: none;
  stroke: rgba(255,255,255,.07);
  stroke-width: 28;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.road {
  fill: none;
  stroke: var(--orange);
  stroke-width: 28;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: draw 2.2s var(--ease) .3s forwards;
}
.stp { opacity: 0; animation: pop .55s cubic-bezier(.3,1.6,.5,1) forwards }
.stp:nth-child(1) { animation-delay: .55s }
.stp:nth-child(2) { animation-delay: .95s }
.stp:nth-child(3) { animation-delay: 1.35s }
.stp circle { fill: #fff }
.stp.end circle { fill: var(--amber) }
.stp .n {
  font: 400 28px var(--display);
  fill: var(--navy);
  text-anchor: middle;
  dominant-baseline: central;
}

.shell {
  position: relative;
  z-index: 1;
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 560px);
  gap: 48px;
  align-items: center;
}

.logo { display: block; height: 40px; width: auto }
.eb {
  margin: 72px 0 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  font: 500 15px/1 var(--mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgba(255,255,255,.7);
}
.eb::before {
  content: "";
  width: 12px; height: 12px;
  border-radius: 2px;
  background: var(--orange);
}
h1 {
  margin: 0;
  font: 400 clamp(72px, 9vw, 168px)/.86 var(--display);
  letter-spacing: .004em;
}
h1 span { color: var(--orange) }
.lede {
  margin: 28px 0 0;
  max-width: 520px;
  font: 400 20px/1.5 var(--sans);
  color: rgba(255,255,255,.84);
}
.for {
  margin: 24px 0 0;
  display: none;
  gap: 10px;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(255,255,255,.1);
  font: 400 16px var(--sans);
  color: rgba(255,255,255,.8);
  width: max-content;
}
.for.on { display: inline-flex }
.for b { font-weight: 600; color: #fff }

.decks {
  margin: 0;
  display: grid;
  gap: 16px;
}
.deck {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 22px;
  align-items: start;
  min-width: 0;
  padding: 28px 30px;
  border-radius: 20px;
  background: var(--navy3);
  text-decoration: none;
  outline: 1px solid transparent;
  transition: background .25s var(--ease), outline-color .25s var(--ease);
}
.deck:hover,
.deck:focus-visible {
  background: #12547f;
  outline-color: var(--orange);
}
.deck:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px }
.num {
  font: 400 44px/1 var(--display);
  color: var(--amber);
  min-width: 1.4em;
}
.kicker {
  margin: 0 0 8px;
  font: 500 12px/1 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.6);
}
.title {
  margin: 0;
  font: 600 26px/1.2 var(--sans);
}
.blurb {
  margin: 10px 0 0;
  font: 400 16px/1.45 var(--sans);
  color: rgba(255,255,255,.78);
}
.meta {
  margin: 16px 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.meta li {
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,.1);
  font: 500 12px/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.78);
}
.go {
  align-self: center;
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--orange);
  color: var(--navy2);
  transition: background .25s;
}
.deck:hover .go { background: var(--amber) }
.status {
  display: inline-block;
  margin-left: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  font: 500 11px/1 var(--mono);
  letter-spacing: .1em;
  text-transform: uppercase;
  vertical-align: middle;
}
.status.live { background: #17773F; color: #fff }
.status.draft { background: rgba(255,255,255,.16); color: var(--amber) }

.foot {
  position: relative;
  z-index: 1;
  max-width: 1440px;
  margin: 56px auto 0;
  display: flex;
  align-items: center;
  gap: 16px;
  font: 500 13px/1 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.5);
}
.foot .sp { flex: 1 }
.dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,.28);
}

@media (max-width: 1100px) {
  .page { padding: 32px 24px 40px }
  .shell { grid-template-columns: 1fr; gap: 8px; align-items: start }
  .eb { margin-top: 40px }
  .decks { margin-top: 36px }
  .bg { width: 420px; opacity: .35 }
}
@media (max-width: 560px) {
  h1 { font-size: 72px }
  .deck { grid-template-columns: auto 1fr; padding: 22px }
  .go { display: none }
}
@media (prefers-reduced-motion: reduce) {
  .road, .stp { animation: none }
  .road { stroke-dashoffset: 0 }
  .stp { opacity: 1 }
}
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: none } }
  </style>
</head>
<body>

    <div class="bg" aria-hidden="true">
      <svg viewBox="0 0 640 640">
        <path class="road-b" d="M40 120 H460 A100 100 0 0 1 460 320 H160 A100 100 0 0 0 160 520 H520"/>
        <path class="road" pathLength="1" d="M40 120 H460 A100 100 0 0 1 460 320 H160 A100 100 0 0 0 160 520 H520"/>
        <g class="stp" transform="translate(90 120)"><circle r="26"/><text class="n">01</text></g>
        <g class="stp" transform="translate(360 320)"><circle r="26"/><text class="n">02</text></g>
        <g class="stp end" transform="translate(520 520)"><circle r="26"/><text class="n">03</text></g>
      </svg>
    </div>

    <div class="shell">
      <header>
        <svg class="logo" width="251" height="57" viewBox="0 0 251 57" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Innoraft">
          <g clip-path="url(#logo-clip)">

          <defs>
            <clipPath id="logo-clip"><rect width="251" height="56.5432" fill="white"/></clipPath>
          </defs>
        </svg>
        <p class="eb">Presentation library</p>
        <h1>Project <span>decks</span></h1>
        <p class="lede">Delivery briefings and integration walkthroughs, in one place. Open a deck to present.</p>
        <p class="for" id="for">Prepared for <b></b></p>
      </header>

      <nav class="decks" id="decks" aria-label="Available presentations"></nav>
    </div>

    <footer class="foot">
      <span>Innoraft</span>
      <span class="dot"></span>
      <span>Presentation library</span>
      <span class="sp"></span>
      <span id="count"></span>
    </footer>
  </div>

  <noscript>
    <p class="vh">JavaScript is off. Open <a href="headless-project-roadmap.html">Headless Project roadmap</a>.</p>
  </noscript>

  <script>
(function () {
  /*
    Add a new presentation by appending an object to DECKS:

    {
      href: 'your-file.html',
      kicker: 'Category label',
      title: 'Deck title',
      blurb: 'One-sentence description.',
      meta: ['5 phases', '14 slides'],
      status: 'Live'   // Live | Draft — omit to hide the pill
    }
  */
  var DECKS = [
    {
      href: 'headless-project-roadmap.html',
      kicker: 'Delivery roadmap',
      title: 'Headless Project',
      blurb: 'Five connected phases, with infrastructure and QA running as parallel lanes.',
      meta: ['5 phases', '14 milestones'],
      status: 'Live'
    }
  ];

  var q = location.search;
  var who = new URLSearchParams(q).get('for');
  if (who) {
    var fe = document.getElementById('for');
    fe.classList.add('on');
    fe.querySelector('b').textContent = who.trim().slice(0, 60);
  }

  function href(path) {
    if (!q) return path;
    return path + (path.indexOf('?') === -1 ? q : '&' + q.slice(1));
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  var root = document.getElementById('decks');
  root.innerHTML = DECKS.map(function (d, i) {
    var n = String(i + 1).padStart(2, '0');
    var pill = d.status
      ? '<span class="status ' + (d.status.toLowerCase() === 'live' ? 'live' : 'draft') + '">' + esc(d.status) + '</span>'
      : '';
    var meta = (d.meta || []).map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('');
    return (
      '<a class="deck" href="' + esc(href(d.href)) + '">' +
        '<span class="num">' + n + '</span>' +
        '<span>' +
          '<p class="kicker">' + esc(d.kicker) + pill + '</p>' +
          '<h2 class="title">' + esc(d.title) + '</h2>' +
          '<p class="blurb">' + esc(d.blurb) + '</p>' +
          (meta ? '<ul class="meta">' + meta + '</ul>' : '') +
        '</span>' +
        '<span class="go" aria-hidden="true">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</span>' +
      '</a>'
    );
  }).join('');

  document.getElementById('count').textContent =
    DECKS.length === 1 ? '01 deck' : String(DECKS.length).padStart(2, '0') + ' decks';
})();
  </script>
